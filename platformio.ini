[platformio]
default_envs = sequencer

; =============================================================================
; SHARED CONFIGURATION
; =============================================================================
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Common libraries for all devices
lib_deps =
    fastled/FastLED@^3.6.0
    bblanchon/ArduinoJson@^6.21.0

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS=1
    -D WIFI_SSID=\"YourWiFiSSID\"
    -D WIFI_PASSWORD=\"YourWiFiPassword\"

; =============================================================================
; SEQUENCER (Master Controller)
; =============================================================================
[env:sequencer]
board = esp32dev
build_src_filter = +<sequencer/>
lib_deps =
    ${env.lib_deps}
    esphome/ESPAsyncWebServer-esphome@^3.0.0

build_flags =
    ${env.build_flags}
    -D DEVICE_TYPE_SEQUENCER=1
    -D ENABLE_WEBSERVER=1
    -D ENABLE_OTA=1

; OTA configuration
upload_protocol = espota
upload_port = 192.168.1.100  ; Update with actual IP
upload_flags =
    --auth=1dPongOTA

; =============================================================================
; BUZZER (Player Input Device)
; =============================================================================
[env:buzzer]
board = esp32dev
build_src_filter = +<buzzer/>
lib_deps =
    ${env.lib_deps}

build_flags =
    ${env.build_flags}
    -D DEVICE_TYPE_BUZZER=1
    -D ENABLE_OTA=1
    -D BUTTON_PIN=0
    -D LED_BUILTIN=2

; OTA configuration
upload_protocol = espota
upload_port = 192.168.1.101  ; Buzzer 1 IP
; upload_port = 192.168.1.102  ; Buzzer 2 IP (uncomment as needed)

; =============================================================================
; LAMP (LED Display Device)
; =============================================================================
[env:lamp]
board = esp32dev
build_src_filter = +<lamp/>
lib_deps =
    ${env.lib_deps}

build_flags =
    ${env.build_flags}
    -D DEVICE_TYPE_LAMP=1
    -D ENABLE_OTA=1
    -D COB_LED_PIN=12
    -D STRIP_LED_PIN=13
    -D NUM_STRIP_LEDS=20

; OTA configuration
upload_protocol = espota
upload_port = 192.168.1.110  ; Lamp IP (update for each lamp 110-120)
